name: CI Build & Quality Check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: craftcut-app/package-lock.json

      - name: Install dependencies
        working-directory: craftcut-app
        run: npm ci

      - name: TypeScript & Vite Build
        working-directory: craftcut-app
        run: npm run build

      - name: Verify Capacitor Sync
        working-directory: craftcut-app
        run: npx cap sync android
