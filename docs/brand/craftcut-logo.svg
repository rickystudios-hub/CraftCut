<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe259" />
      <stop offset="100%" stop-color="#ffa751" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Icon: Dual Filmstrip Cut Pill (CapCut signature shape) -->
  <g transform="translate(15, 12)">
    <!-- Base dark rounded diamond / pill -->
    <rect x="0" y="8" width="80" height="80" rx="22" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
    
    <!-- Left shear blade / chevron -->
    <path d="M 24 28 L 48 48 L 24 68 Z" fill="url(#cyanGrad)" />
    <!-- Right shear blade -->
    <path d="M 40 28 L 64 48 L 40 68 Z" fill="#ffffff" opacity="0.95" />
    <!-- Pro Gold Crown Accent Dot -->
    <circle cx="56" cy="28" r="6" fill="url(#goldGrad)" filter="url(#glow)"/>
  </g>

  <!-- Typography -->
  <text x="115" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-weight="900" font-size="44" fill="#0f172a" letter-spacing="-1">
    Craft<tspan fill="url(#cyanGrad)">Cut</tspan>
  </text>
  <text x="117" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-weight="600" font-size="13" fill="#64748b" letter-spacing="3.5">
    OPEN SOURCE VIDEO EDITOR
  </text>
</svg>
